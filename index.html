<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Automateze AI</title>
  <meta name="description" content="SwiftOps Automation — Intelligent AI-driven automation solutions for modern enterprises. AI agents, chatbots, workflow automation, and custom digital solutions.">

  <!-- PERF: Preconnect to Google Fonts + Spline CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://prod.spline.design" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"></noscript>

  <!-- Preload critical assets -->
  <link rel="preload" href="/images/swiftops-logo.jpeg" as="image" fetchpriority="high">

  <style>
    /* Jotform Chatbot Branding Hide */
    .jf-branding,
    .jotform-branding,
    a[href*="jotform.com"] {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    #jotform-branding-overlay {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 350px;
      height: 40px;
      background-color: #ffffff;
      z-index: 999999;
      pointer-events: none;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      display: none;
    }

    /* PERF: Reserve space to prevent CLS */
    #root { min-height: 100vh; }
  </style>
</head>

<body style="font-family: 'Inter', sans-serif;">
  <div id="root"></div>
  <div id="jotform-branding-overlay"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Jotform Chatbot Integration (Deferred until interaction) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let scriptLoaded = false;
      const loadJotform = () => {
        if (scriptLoaded) return;
        scriptLoaded = true;

        var script = document.createElement('script');
        script.src = "https://cdn.jotfor.ms/agent/embedjs/019c325ea1fa7d58858edbc5056d52742880/embed.js";
        script.async = true;
        script.defer = true;
        document.body.appendChild(script);

        var checkInterval = setInterval(function () {
          var brandingElements = document.querySelectorAll('a[href*="jotform.com"], .jf-branding, .jotform-branding');
          brandingElements.forEach(function (el) {
            el.style.display = 'none';
            el.style.opacity = '0';
            el.style.visibility = 'hidden';
          });
        }, 1000);

        setTimeout(function () {
          clearInterval(checkInterval);
        }, 15000);
      };

      // PERF: Load on user interaction to save LCP/TBT metrics
      window.addEventListener('scroll', loadJotform, { passive: true, once: true });
      window.addEventListener('mousemove', loadJotform, { passive: true, once: true });
      window.addEventListener('touchstart', loadJotform, { passive: true, once: true });
      
      // Fallback if no interaction
      setTimeout(loadJotform, 8000);
    });
  </script>

  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); }
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>

</html>
